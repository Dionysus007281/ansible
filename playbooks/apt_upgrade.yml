---
- hosts: all
  become: true
  tasks:
    - name: upgrade all apt packages
      apt:
        upgrade: yes
        update_cache: yes

    - name: Send ntfy.sh update
      uri:
        url: "https://ntfy.lankhorst.org/Test"
        method: POST
        body: "{{ inventory_hostname }} task completed"

